name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore backend
        run: dotnet restore FamilyChat.sln

      - name: Build backend
        run: dotnet build FamilyChat.sln --configuration Release --no-restore

      - name: Validate migration models
        run: |
          dotnet tool restore
          ./scripts/check-migrations.sh

      - name: Test backend
        run: dotnet test FamilyChat.sln --configuration Release --no-build
        env:
          RUN_INTEGRATION_TESTS: "1"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Web/package-lock.json

      - name: Install web dependencies
        working-directory: src/Web
        run: npm ci

      - name: Type-check web
        working-directory: src/Web
        run: npm run typecheck

      - name: Test web components
        working-directory: src/Web
        run: npm test

      - name: Build web
        working-directory: src/Web
        run: npm run build

      - name: Validate repository and Compose
        run: |
          ./scripts/check-structure.sh
          docker compose config --quiet

      - name: Validate Nginx configuration
        run: |
          if ! output=$(docker run --rm --entrypoint nginx \
            --volume "$PWD/src/Web/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine -t 2>&1); then
            echo "$output"
            message=$(echo "$output" | tail -n 1 | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Nginx configuration invalid::$message"
            exit 1
          fi
          echo "$output"

      - name: Validate Prometheus configuration and alerts
        run: |
          docker run --rm --entrypoint promtool \
            --volume "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.54.1 \
            check config /etc/prometheus/prometheus.yml

  e2e:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Web/package-lock.json

      - name: Install web and browser dependencies
        working-directory: src/Web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start distributed stack
        run: |
          cp .env.example .env
          docker compose up --detach --build --wait --wait-timeout 240
          curl --fail http://localhost:5000/health

      - name: Run two-user browser flow
        working-directory: src/Web
        run: npm run test:e2e

      - name: Run k6 smoke test
        run: docker compose --profile test run --rm k6

      - name: Capture container logs
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Stop distributed stack
        if: always()
        run: docker compose down --volumes
