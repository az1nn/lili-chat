name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore backend
        run: dotnet restore FamilyChat.sln

      - name: Build backend
        run: dotnet build FamilyChat.sln --configuration Release --no-restore

      - name: Validate migration models
        run: |
          dotnet tool restore
          ./scripts/check-migrations.sh

      - name: Test backend
        run: dotnet test FamilyChat.sln --configuration Release --no-build
        env:
          RUN_INTEGRATION_TESTS: "1"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Web/package-lock.json

      - name: Install web dependencies
        working-directory: src/Web
        run: npm ci

      - name: Type-check web
        working-directory: src/Web
        run: npm run typecheck

      - name: Test web components
        working-directory: src/Web
        run: npm test

      - name: Build web
        working-directory: src/Web
        run: npm run build

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Validate deployment contracts
        run: ruby scripts/check-deployment-contracts.rb

      - name: Validate security contracts
        run: ruby scripts/check-security-contracts.rb

      - name: Validate repository and Compose
        run: |
          ./scripts/check-structure.sh
          docker compose config --quiet

      - name: Validate Nginx configuration
        run: |
          if ! output=$(docker run --rm --entrypoint nginx \
            --add-host gateway:127.0.0.1 \
            --volume "$PWD/src/Web/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine -t 2>&1); then
            echo "$output"
            message=$(echo "$output" | grep -m1 '\[emerg\]' || echo "$output" | tail -n 1)
            message=$(echo "$message" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Nginx configuration invalid::$message"
            exit 1
          fi
          echo "$output"

      - name: Validate Prometheus configuration and alerts
        run: |
          docker run --rm --entrypoint promtool \
            --volume "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.54.1 \
            check config /etc/prometheus/prometheus.yml

  e2e:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    env:
      NOTIFICATION_PROVIDER: Stub
      NOTIFICATION_ALLOW_STUB: "true"
      NOTIFICATION_INCLUDE_CONTENT: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Web/package-lock.json

      - name: Install web and browser dependencies
        working-directory: src/Web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start distributed stack
        id: stack
        run: |
          diagnose_stack() {
            echo "=== Distributed stack diagnostics ==="
            docker compose ps --all 2>&1 || true

            identity_id=$(docker ps -aq --filter "name=familychat-identity-svc-1" | head -n1 || true)
            echo "identity-svc container id: ${identity_id:-<none>}"

            if [ -n "$identity_id" ]; then
              echo "=== identity-svc state ==="
              docker inspect \
                --format 'status={{.State.Status}} exit={{.State.ExitCode}} oomKilled={{.State.OOMKilled}} error={{json .State.Error}} startedAt={{.State.StartedAt}} finishedAt={{.State.FinishedAt}}' \
                "$identity_id" 2>&1 || true
              echo "=== identity-svc logs ==="
              docker logs --tail 300 "$identity_id" 2>&1 || true
            fi
          }
          trap diagnose_stack ERR
          cp .env.example .env
          docker compose up --detach --build --wait --wait-timeout 240
          curl --fail http://localhost:5000/health
          trap - ERR

      - name: Run two-user browser flow
        id: browser
        continue-on-error: true
        working-directory: src/Web
        run: npm run test:e2e

      - name: Verify stub notification delivery
        id: notification
        if: ${{ always() && !cancelled() && steps.stack.outcome == 'success' && steps.browser.outcome == 'success' }}
        continue-on-error: true
        run: |
          for attempt in $(seq 1 30); do
            state=$(docker compose exec -T postgres-notification psql \
              --username app --dbname notification \
              --tuples-only --no-align --field-separator='|' \
              --command "SELECT a.\"Status\", COUNT(d.\"Id\"), COUNT(*) FILTER (WHERE d.\"Status\" = 'delivered') FROM notification_audit a LEFT JOIN notification_delivery d ON d.\"AuditId\" = a.\"Id\" WHERE a.\"Id\" = (SELECT \"Id\" FROM notification_audit ORDER BY \"CreatedAt\" DESC LIMIT 1) GROUP BY a.\"Id\", a.\"Status\";" \
              | tr -d '[:space:]')
            IFS='|' read -r status total delivered <<< "$state"
            if [ "$status" = "delivered" ] && [ "${total:-0}" -gt 0 ] && [ "$delivered" = "$total" ]; then
              echo "Verified $delivered stub notification delivery record(s)"
              exit 0
            fi
            sleep 1
          done

          ledger=$(docker compose exec -T postgres-notification psql \
            --username app --dbname notification \
            --tuples-only --no-align --field-separator='|' \
            --command 'SELECT a."MessageId", a."Status", d."UserId", d."Status", d."Attempts", COALESCE(d."LastError", a."LastError"), (SELECT COUNT(*) FROM notification_contact) AS contacts FROM notification_audit a LEFT JOIN notification_delivery d ON d."AuditId" = a."Id" ORDER BY a."CreatedAt" DESC;')
          annotation=$(echo "$ledger" | tr '\n' ';' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
          echo "::error title=Notification delivery ledger::$annotation"
          docker compose logs --no-color --tail=200 notification-svc
          exit 1

      - name: Run k6 smoke test
        id: k6
        if: ${{ always() && !cancelled() && steps.stack.outcome == 'success' }}
        continue-on-error: true
        run: docker compose --profile test run --rm k6

      - name: Drill database backup and restore
        id: backup
        if: ${{ always() && !cancelled() && steps.stack.outcome == 'success' }}
        continue-on-error: true
        run: |
          backup_dir=$(mktemp -d)
          ./scripts/backup-databases.sh "$backup_dir"
          CLEANUP_RESTORED_DATABASES=1 \
            ./scripts/restore-databases.sh "$backup_dir" _restore_ci

      - name: Run dependency outage and recovery flow
        id: resilience
        if: ${{ always() && !cancelled() && steps.stack.outcome == 'success' }}
        continue-on-error: true
        working-directory: src/Web
        run: npm run test:resilience

      - name: Assert distributed checks
        if: ${{ always() && !cancelled() && steps.stack.outcome == 'success' }}
        run: |
          failed=0
          for result in \
            "browser:${{ steps.browser.outcome }}" \
            "notification:${{ steps.notification.outcome }}" \
            "k6:${{ steps.k6.outcome }}" \
            "backup:${{ steps.backup.outcome }}" \
            "resilience:${{ steps.resilience.outcome }}"; do
            name=${result%%:*}
            outcome=${result#*:}
            if [ "$outcome" != success ]; then
              echo "::error title=Distributed check failed::$name finished with $outcome"
              failed=1
            fi
          done
          exit "$failed"

      - name: Capture container logs
        if: failure()
        run: |
          docker compose ps --all 2>&1 || true
          docker compose logs --no-color --tail=300 2>&1 || true

      - name: Stop distributed stack
        if: always()
        run: docker compose down --volumes
